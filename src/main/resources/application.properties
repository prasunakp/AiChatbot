spring.application.name=demo

spring.ai.google.genai.api-key=${GCP_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

spring.ai.google.genai.embedding.api-key=${GCP_API_KEY}

spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.ai.google.genai.embedding.text.dimensions=768

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_chatbot
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB